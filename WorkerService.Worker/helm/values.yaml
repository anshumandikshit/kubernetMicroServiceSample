replicaCount: 1

image:
  repository: ghcr.io/your-org/workerservice
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  host: ""
  path: /workerservice(/|$)(.*)
  className: nginx

resources: {}
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

env:
  ASPNETCORE_ENVIRONMENT: Development

debug:
  enabled: false
  port: 80